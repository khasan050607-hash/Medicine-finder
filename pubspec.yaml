name: medicine_finder
description: "Pharmacy medicine finder app — search by shelf, and later find boxes on a shelf via camera."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  sqflite: ^2.3.0
  path: ^1.9.0
  path_provider: ^2.1.2
  image_picker: ^1.0.7
  video_thumbnail: ^0.5.3
  video_player: ^2.8.6
  image: ^4.1.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
